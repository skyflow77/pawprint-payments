<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#EEF3EC;
    --card:#FFFFFF;
    --ink:#16302C;
    --ink-soft:#4C635D;
    --line:#D8E2DA;
    --amber:#E8A33D;
    --coral:#D9704F;
    --green:#4B8B6F;
    --shadow: 0 1px 2px rgba(22,48,44,.06), 0 8px 24px rgba(22,48,44,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:32px 24px 80px;}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .paw{width:34px; height:34px; flex:none;}
  .logo-mark{
    width:88px; height:69px; flex:none; border-radius:16px; overflow:hidden;
    display:block; box-shadow:0 1px 3px rgba(22,48,44,.18);
  }
  .logo-mark svg{display:block; width:100%; height:100%;}
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:28px; margin:0;
    letter-spacing:-.01em;
  }
  .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  button{
    font-family:inherit; font-size:13.5px; font-weight:500; cursor:pointer;
    border-radius:8px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); padding:9px 14px; transition:.15s ease;
  }
  button:hover{border-color:var(--ink-soft);}
  button.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  button.primary:hover{background:#0e211d;}
  button.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  button.ghost:hover{color:var(--ink); background:rgba(0,0,0,.03);}
  button.small{padding:6px 10px; font-size:12.5px;}
  button.icon-btn{padding:9px; display:inline-flex; align-items:center; justify-content:center; border-color:var(--line);}
  button.icon-btn:hover{color:var(--ink); border-color:var(--ink-soft);}
  .seg{display:flex; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px;}
  .seg button{border:none; background:transparent; padding:6px 12px; border-radius:6px;}
  .seg button.active{background:var(--ink); color:#fff;}
  .seg button.ai-tab{background:#E8DFF7; color:#6B4E9C; font-weight:600;}
  .seg button.ai-tab:hover{background:#DED0F3;}
  .seg button.ai-tab.active{background:#C9AEED; color:#4A2E7A;}

  .month-switcher{
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin:24px auto 4px; padding:14px 30px; max-width:fit-content;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow);
  }
  .month-switcher-label{
    font-family:'Fraunces', serif; font-size:22px; font-weight:700; text-transform:capitalize;
    min-width:200px; text-align:center; color:var(--ink);
  }
  .month-switcher button{
    width:38px; height:38px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; border:1px solid var(--line); background:var(--card);
    color:var(--ink); transition:.15s ease;
  }
  .month-switcher button:hover{
    background:var(--ink); color:#fff; border-color:var(--ink); transform:scale(1.06);
  }
    .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0 28px;
  }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat.balance{background:#16302C; border-color:#16302C;}
  .stat.balance .label{color:#A9C2BB;}
  .stat.balance .val{color:#F4EFE4;}
  .stat.balance .hint{color:#7C978F;}
  .stat .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .stat .val{font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; margin-top:6px;}
  .stat.out .val{color:var(--coral);}
  .stat.in .val{color:var(--green);}
  .stat .hint{font-size:11px; color:var(--ink-soft); margin-top:3px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}

  /* list view */
  .month-group{padding:18px 20px 6px;}
  .month-title{font-family:'Fraunces', serif; font-size:15px; font-weight:600; color:var(--ink-soft); text-transform:capitalize; margin:0 0 4px;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); padding:8px 20px; border-bottom:1px solid var(--line); font-weight:600;
  }
  tbody td{padding:12px 20px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tbody td:first-child{white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBF9;}
  .amt{font-family:'IBM Plex Mono', monospace; font-weight:600; text-align:right;}
  .amt.out{color:var(--coral);}
  .amt.in{color:var(--green);}
  .tag{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:999px; font-weight:500;
    background:#EEF3EC; color:var(--ink-soft);
  }
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;}
  .badge.paid{background:#E4F1EA; color:var(--green);}
  .badge.pending{background:#FBF1E0; color:#A8721F;}
  .badge.overdue{background:#FBE7E0; color:var(--coral);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .empty{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .empty .paw{width:40px;height:40px;opacity:.35; margin-bottom:10px;}

  /* calendar view */
  .cal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line);}
  .cal-head .title{font-family:'Fraunces', serif; font-size:17px; font-weight:600; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr);}
  .cal-dow{padding:8px 6px; font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); text-align:center; border-bottom:1px solid var(--line); font-weight:600;}
  .cal-cell{
    min-height:88px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:6px 6px; position:relative;
  }
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.mute{background:#FAFBF9; color:#C4CDC7;}
  .cal-cell.today{background:#FDF7EC;}
  .cal-num{font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .cal-cell.today .cal-num{color:var(--amber); font-weight:700;}
  .cal-item{
    margin-top:4px; font-size:10.5px; padding:2px 6px; border-radius:5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  }
  .cal-item.out{background:#FBE7E0; color:#A94F30;}
  .cal-item.in{background:#E4F1EA; color:#357257;}
  .cal-item.paid{opacity:.5; text-decoration:line-through;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(22,48,44,.35); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--card); border-radius:16px; width:100%; max-width:440px; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,.25);}

  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  .login-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:36px 32px; width:100%; max-width:380px;
  }
  .login-card h2{font-family:'Fraunces', serif; font-size:22px; margin:0;}
  .login-card .logo-mark{display:block;}
  .modal h2{font-family:'Fraunces', serif; font-size:19px; margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:16px; background:#fff; color:var(--ink);
    min-height:46px; box-sizing:border-box; line-height:1.3;
  }
  .field input[type="date"]{
    padding:12px 12px; min-height:48px; -webkit-appearance:none; appearance:none;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:transparent;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
  .modal-actions .left{display:flex; gap:8px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:9px; font-size:13px;
    opacity:0; pointer-events:none; transition:.2s ease; z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .shared-note{font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--green);}
  .dot.off{background:var(--coral);}
  .config-warning{background:#FBE7E0; border:1px solid #EFC0AC; color:#7A3A24; padding:14px 18px; border-radius:12px; font-size:13px; margin-bottom:20px; line-height:1.5;}
  .config-warning code{background:rgba(0,0,0,.06); padding:1px 6px; border-radius:5px; font-family:'IBM Plex Mono', monospace;}

  @media (max-width:640px){
    .summary{grid-template-columns:repeat(2,1fr);}
    thead{display:none;}
    tbody td{display:block; padding:4px 20px;}
    tbody tr{display:block; padding:10px 0; border-bottom:1px solid var(--line);}
    .amt{text-align:left;}
    .row-actions{justify-content:flex-start; margin-top:6px;}
    .row2{grid-template-columns:1fr; gap:14px;}
    .modal{padding:20px; max-width:100%;}
    .overlay{padding:12px;}
  }
</style>
</head>

async function loadTypes(){

    await sb.from('app_settings').upsert({key:'types', value:types});
  }else{
    types = data.value;
  }
}
async function saveTypes(){
  const {error} = await sb.from('app_settings').upsert({key:'types', value:types});
  if(error) showToast('Не удалось сохранить настройки: ' + error.message, true);

/* ---------- начальный баланс ---------- */
async function loadBalanceSettings(){
  if(!CONFIGURED) return;
  const {data, error} = await sb.from('app_settings').select('value').eq('key','balance').maybeSingle();
  if(!error && data && data.value) balanceSettings = data.value;
}
async function saveBalanceSettings(){
  const {error} = await sb.from('app_settings').upsert({key:'balance', value:balanceSettings});
  if(error) showToast('Не удалось сохранить баланс: ' + error.message, true);
}

function netAmount(p){
  return (getType(p.type).dir==='in' ? 1 : -1) * Number(p.amount);
}
function balanceBefore(dateStr){
  let bal = Number(balanceSettings.amount)||0;
  payments.forEach(p=>{
    if(p.date >= balanceSettings.date && p.date < dateStr) bal += netAmount(p);
  });
  return bal;
}
function addMonths(ymStr, n){
  let [y, m] = ymStr.split('-').map(Number);
  m += n;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return `${y}-${String(m).padStart(2,'0')}-01`;
}

/* ---------- платежи ---------- */
function rowToClient(r){
  return {id:r.id, recipient:r.recipient, date:r.date, amount:Number(r.amount), type:r.type, note:r.note||'', paid:r.paid};
}
async function loadPayments(){
  if(!CONFIGURED){
    showConfigWarning();
    setConn(false, 'База не подключена');
    payments = [];
    render();
    return;
  }
  setConn(false, 'Загрузка…');
  const {data, error} = await sb.from('payments').select('*').order('date', {ascending:true});
  if(error){ setConn(false, 'Ошибка подключения к базе'); showToast('Не удалось загрузить данные', true); return; }
  payments = data.map(rowToClient);
  setConn(true, 'Подключено — данные общие для команды');
  render();
}
async function insertPayment(p){
  const {data, error} = await sb.from('payments').insert([{
    recipient:p.recipient, date:p.date, amount:p.amount, type:p.type, note:p.note||null, paid:false
  }]).select();
  if(error){ showToast('Не удалось сохранить: ' + error.message, true); return false; }
  payments.push(rowToClient(data[0]));
  return true;
}
async function updatePayment(id, fields){
  const {error} = await sb.from('payments').update(fields).eq('id', id);
  if(error){ showToast('Не удалось обновить: ' + error.message, true); return false; }
  const p = payments.find(p=>p.id===id);
  if(p) Object.assign(p, fields);
  return true;
}
async function deletePaymentRemote(id){
  const {error} = await sb.from('payments').delete().eq('id', id);
  if(error){ showToast('Не удалось удалить: ' + error.message, true); return false; }
  payments = payments.filter(p=>p.id!==id);
  return true;
}

function subscribeRealtime(){
  if(!CONFIGURED) return;
  sb.removeAllChannels(); // на случай повторного логина — убираем подписки прошлой сессии
  sb.channel('payments-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'payments'}, ()=>{ loadPayments(); })
    .subscribe();
  sb.channel('settings-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'app_settings'}, async ()=>{
      await loadTypes(); await loadBalanceSettings(); render();
    })
    .subscribe();
}

function fmt(n){ return new Intl.NumberFormat('ru-RU').format(n) + ' ₸'; }

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function defaultNewDate(){
  const now = new Date();

function distributePercents(amounts, total){
  // Метод наибольшего остатка: округляем так, чтобы сумма процентов всегда была 100
  const raw = amounts.map(a => total ? (a/total*100) : 0);
  const floors = raw.map(v => Math.floor(v));
  let remainder = 100 - floors.reduce((s,v)=>s+v,0);
  const order = raw.map((v,i)=>[i, v-Math.floor(v)]).sort((a,b)=>b[1]-a[1]);
  const result = [...floors];
  for(let i=0; i<remainder && order.length; i++){
    result[order[i % order.length][0]] += 1;
  }
  return result;
}

function renderExpenseChart(){
  const panel = document.getElementById('chartPanel');
  if(!panel) return;
  const ym = `${selectedMonth.getFullYear()}-${String(selectedMonth.getMonth()+1).padStart(2,'0')}`;
  const monthOut = payments.filter(p=>p.date.slice(0,7)===ym && getType(p.type).dir==='out');
  const totals = {};
  monthOut.forEach(p=>{ totals[p.type] = (totals[p.type]||0) + Number(p.amount); });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,[,v])=>s+v,0);

  const header = `<div style="padding:20px 24px 0;">
    <div class="month-title" style="margin:0;">Структура расходов</div>
  </div>`;

  if(!entries.length){
    panel.innerHTML = header + `<div style="padding:16px 24px 24px;">
      <div style="color:var(--ink-soft); font-size:13px;">Расходов за этот месяц пока нет.</div>
    </div>`;
    return;
  }

  const COLORS = ['#D9704F','#E8A33D','#4B8B6F','#5B84A6','#9B6FA0','#C9A227','#6E8F87','#B4756A','#7C93C4','#A98BC7'];
  const r = 70, cx = 100, cy = 100, sw = 28;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const arcs = entries.map(([typeId, amt], i)=>{
    const frac = amt/total;
    const len = frac*circumference;
    const dasharray = `${len} ${circumference-len}`;
    const dashoffset = -offset;
    offset += len;
    const color = COLORS[i % COLORS.length];
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}"/>`;
  }).join('');

  const pcts = distributePercents(entries.map(([,amt])=>amt), total);
  const legend = entries.map(([typeId, amt], i)=>{
    const t = getType(typeId);
    const pct = pcts[i];
    const color = COLORS[i % COLORS.length];
    return `<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line);">
      <div style="display:flex; align-items:center; gap:9px; min-width:0;">
        <span style="width:10px;height:10px;border-radius:3px;background:${color};flex:none;"></span>
        <span style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(t.label)}</span>
      </div>
      <div style="display:flex; gap:10px; align-items:baseline; flex:none;">
        <span style="font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);">${pct}%</span>
        <span style="font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600; color:var(--coral);">${fmt(amt)}</span>
      </div>
    </div>`;
  }).join('');

  panel.innerHTML = header + `
    <div style="padding:16px 24px 24px; display:flex; gap:32px; flex-wrap:wrap; align-items:center;">
      <div style="position:relative; flex:none; width:200px; height:200px;">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <g transform="rotate(-90 100 100)">${arcs}</g>
        </svg>
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <div style="font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;">Итого</div>
          <div style="font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:15px; margin-top:2px;">${fmt(total)}</div>
        </div>
      </div>
      <div style="flex:1; min-width:240px; max-width:380px;">
        ${legend}
      </div>
    </div>`;
}

function renderSummary(){
  const now = new Date();

  const monthStart = ym+'-01';
  const monthEnd = addMonths(ym, 1);
  const thisMonth = payments.filter(p=>p.date.slice(0,7)===ym);
  const outPlanned = thisMonth.filter(p=>getType(p.type).dir==='out').reduce((s,p)=>s+Number(p.amount),0);
  const inPlanned = thisMonth.filter(p=>getType(p.type).dir==='in').reduce((s,p)=>s+Number(p.amount),0);
  const overdue = payments.filter(p=>statusOf(p)==='overdue').length;
  const upcoming7 = payments.filter(p=>{
    const d = new Date(p.date); const diff=(d-now)/86400000;
    return !p.paid && diff>=0 && diff<=7;
  }).length;
  const balStart = balanceBefore(monthStart);
  const balEnd = balanceBefore(monthEnd);

  document.getElementById('summary').innerHTML = `
    <div class="stat balance"><div class="label">Баланс на начало месяца</div><div class="val">${fmt(balStart)}</div><div class="hint">с учётом начального баланса</div></div>

    <div class="stat"><div class="label">Ближайшие 7 дней</div><div class="val">${upcoming7}</div><div class="hint">ожидают оплаты, независимо от месяца</div></div>

function renderCalendar(){
  const panel = document.getElementById('panel');
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  let cells = [];
  for(let i=startDow;i>0;i--) cells.push({n:prevDays-i+1, mute:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({n:d, mute:false, date:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7!==0) cells.push({n:cells.length, mute:true});

  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let html = `<div class="cal-head">
    <button class="ghost small" id="prevMonth">←</button>
    <div class="title">${monthLabel(calMonth)}</div>
    <button class="ghost small" id="nextMonth">→</button>
  </div>
  <div class="cal-grid">`;
  dows.forEach(d=> html+=`<div class="cal-dow">${d}</div>`);
  const today = todayStr();
  cells.forEach(c=>{
    if(c.mute){ html += `<div class="cal-cell mute"><div class="cal-num">${c.n}</div></div>`; return; }
    const dayPayments = payments.filter(p=>p.date===c.date);
    const isToday = c.date===today;
    html += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-num">${c.n}</div>`;
    dayPayments.slice(0,3).forEach(p=>{
      const t = getType(p.type);
      html += `<div class="cal-item ${t.dir} ${p.paid?'paid':''}" data-id="${p.id}" title="${escapeHtml(p.recipient)} — ${fmt(p.amount)}">${escapeHtml(p.recipient)}</div>`;
    });
    if(dayPayments.length>3) html += `<div class="cal-item" style="background:transparent;color:var(--ink-soft)">+${dayPayments.length-3} ещё</div>`;
    html += `</div>`;
  });
  html += `</div>`;
  panel.innerHTML = html;
  document.getElementById('prevMonth').onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
  document.getElementById('nextMonth').onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
  panel.querySelectorAll('.cal-item[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> openModal(payments.find(p=>p.id===el.dataset.id)));
  });
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function openModal(existing){
  if(!CONFIGURED){ showToast('Сначала подключите базу данных', true); return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${existing? 'Изменить платёж':'Новый платёж'}</h2>
      <div class="field"><label>Получатель / статья</label>
        <input id="f_recipient" placeholder="Напр.: Партнёр — зоомагазин «Барсик»" value="${existing?escapeHtml(existing.recipient):''}"></div>
      <div class="row2">
        <div class="field"><label>Дата</label><input id="f_date" type="date" value="${existing?existing.date:defaultNewDate()}"></div>
        <div class="field"><label>Сумма, ₸</label><input id="f_amount" type="text" inputmode="numeric" placeholder="0" value="${existing?formatAmount(existing.amount):''}"></div>
      </div>
      <div class="field"><label>Тип</label>
        <select id="f_type">${types.map(t=>`<option value="${t.id}" ${existing&&existing.type===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Заметка (необязательно)</label>
        <input id="f_note" placeholder="Напр.: понедельничная выплата" value="${existing&&existing.note?escapeHtml(existing.note):''}"></div>
      <div class="modal-actions">
        <div class="left">
          ${existing?`<button id="f_delete" class="ghost">Удалить</button>`:''}
        </div>
        <div style="display:flex; gap:8px;">
          <button id="f_cancel">Отмена</button>
          <button id="f_save" class="primary">Сохранить</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#f_cancel').onclick = ()=> overlay.remove();
  const amountInput = overlay.querySelector('#f_amount');
  amountInput.addEventListener('input', ()=>{
    const raw = amountInput.value.replace(/\D/g,'');
    amountInput.value = raw ? formatAmount(Number(raw)) : '';
  });
  if(existing){
    overlay.querySelector('#f_delete').onclick = async ()=>{
      overlay.remove(); await doDelete(existing.id);
    };
  }
  overlay.querySelector('#f_save').onclick = async ()=>{
    const recipient = overlay.querySelector('#f_recipient').value.trim();
    const date = overlay.querySelector('#f_date').value;
    const amount = Number(overlay.querySelector('#f_amount').value.replace(/\D/g,''));
    const type = overlay.querySelector('#f_type').value;
    const note = overlay.querySelector('#f_note').value.trim();
    if(!recipient || !date || !amount){
      showToast('Заполните получателя, дату и сумму', true);
      return;
    }
    const btn = overlay.querySelector('#f_save'); btn.disabled = true; btn.textContent = 'Сохраняю…';
    let ok;
    if(existing){ ok = await updatePayment(existing.id, {recipient, date, amount, type, note: note||null}); }
    else{ ok = await insertPayment({recipient, date, amount, type, note}); }
    if(ok){ overlay.remove(); render(); showToast('Сохранено'); }
    else{ btn.disabled = false; btn.textContent = 'Сохранить'; }
  };
}

function slugify(label){
  const base = label.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'type';
  return base + '_' + Math.random().toString(36).slice(2,6);
}

function openSettingsModal(){
  if(!CONFIGURED){ showToast('Сначала подключите базу данных', true); return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <h2>Настройки дэшборда</h2>

      <div class="field"><label>Начальный баланс</label></div>
      <div style="font-size:12px; color:var(--ink-soft); margin:-8px 0 10px;">
        Сколько денег было на счету на указанную дату — от этого считается баланс на начало и конец каждого месяца.
      </div>
      <div class="row2" style="margin-bottom:16px;">
        <div class="field"><label>Сумма, ₸</label><input id="balAmount" type="text" inputmode="numeric" value="${formatAmount(balanceSettings.amount||0)}"></div>
        <div class="field"><label>На дату</label><input id="balDate" type="date" value="${balanceSettings.date}"></div>
      </div>
      <div style="margin:-8px 0 20px; display:flex; justify-content:flex-end;">
        <button class="primary small" id="balSave">Сохранить баланс</button>
      </div>

      <div class="field"><label>Типы платежей</label></div>
      <div id="typesList" style="display:flex; flex-direction:column; gap:6px; margin-bottom:16px;"></div>
      <div class="field"><label>Добавить новый тип</label>
        <div style="display:flex; gap:8px;">
          <input id="newTypeLabel" placeholder="Напр.: Возврат клиенту" style="flex:1;">
          <select id="newTypeDir" style="width:120px;">
            <option value="out">Расход</option>
            <option value="in">Доход</option>
          </select>
          <button class="primary small" id="newTypeAdd">+</button>
        </div>
      </div>
      <div class="modal-actions" style="justify-content:flex-end;">
        <button id="settingsClose">Готово</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#settingsClose').onclick = ()=> overlay.remove();

  const balAmountInput = overlay.querySelector('#balAmount');
  balAmountInput.addEventListener('input', ()=>{
    const raw = balAmountInput.value.replace(/\D/g,'');
    balAmountInput.value = raw ? formatAmount(Number(raw)) : '';
  });
  overlay.querySelector('#balSave').onclick = async ()=>{
    const amount = Number(balAmountInput.value.replace(/\D/g,'')) || 0;
    const date = overlay.querySelector('#balDate').value || todayStr();
    balanceSettings = {amount, date};
    await saveBalanceSettings();
    render();
    showToast('Начальный баланс сохранён');
  };

  function renderTypesList(){
    const list = overlay.querySelector('#typesList');
    list.innerHTML = types.map(t=>{
      const inUse = payments.some(p=>p.type===t.id);
      return `<div style="display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:1px solid var(--line); border-radius:8px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="tag">${escapeHtml(t.label)}</span>
          <span style="font-size:11px; color:${t.dir==='out'?'var(--coral)':'var(--green)'};">${t.dir==='out'?'расход':'доход'}</span>
          ${inUse?'<span style="font-size:10.5px; color:var(--ink-soft);">· используется</span>':''}
        </div>
        <button class="small ghost" data-del="${t.id}" title="Удалить тип">✕</button>
      </div>`;
    }).join('') || `<div style="color:var(--ink-soft); font-size:13px;">Типов пока нет — добавьте хотя бы один ниже.</div>`;
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(types.length<=1){ showToast('Должен остаться хотя бы один тип', true); return; }
        const id = btn.dataset.del;
        const used = payments.some(p=>p.type===id);
        if(used && !confirm('Этот тип используется в платежах. Они останутся, но будут помечены как «Неизвестный тип». Удалить?')) return;
        types = types.filter(t=>t.id!==id);
        await saveTypes();
        renderTypesList();
        render();
      });
    });
  }
  renderTypesList();

  overlay.querySelector('#newTypeAdd').onclick = async ()=>{
    const labelInput = overlay.querySelector('#newTypeLabel');
    const label = labelInput.value.trim();
    const dir = overlay.querySelector('#newTypeDir').value;
    if(!label){ showToast('Введите название типа', true); return; }
    types.push({id:slugify(label), label, dir});
    await saveTypes();
    labelInput.value = '';
    renderTypesList();
    render();
  };
}

let appBooted = false;

async function bootApp(){
  if(appBooted) return;
  appBooted = true;
  renderMonthSwitcher(); // название месяца не зависит от базы — показываем сразу
  if(!CONFIGURED) showConfigWarning();
  setConn(false, 'Загрузка…');
  await Promise.all([loadTypes(), loadBalanceSettings(), loadPayments()]);
  render();
  subscribeRealtime();
}

function showApp(email){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  bootApp();
}

function showLogin(message){
  appBooted = false;
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const form = document.getElementById('loginForm');
  if(form) form.reset();
  const errEl = document.getElementById('loginError');
  if(errEl) errEl.textContent = '';
  const hint = document.getElementById('loginHint');
  if(hint) hint.textContent = message || '';
}

const loginForm = document.getElementById('loginForm');
if(loginForm){
  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('loginEmail').value.trim().toLowerCase();
    const email = username.includes('@') ? username : `${username}@pawprint.internal`;
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Входим…';
    try{
      const timeout = new Promise((_, reject)=> setTimeout(()=>reject(new Error('timeout')), 10000));
      const { data, error } = await Promise.race([
        sb.auth.signInWithPassword({ email, password }),
        timeout
      ]);
      if(error){
        errEl.textContent = 'Неверный логин или пароль';
      } else if(data && data.session){
        // не полагаемся только на onAuthStateChange — переключаем экран сразу же
        showApp(data.session.user.email);
      }
    }catch(err){
      errEl.textContent = 'Не удалось войти — проверьте соединение и попробуйте ещё раз';
    }finally{
      btn.disabled = false; btn.textContent = 'Войти';
    }
  });
}

const logoutBtn = document.getElementById('logoutBtn');
if(logoutBtn){
  logoutBtn.addEventListener('click', async ()=>{
    if(CONFIGURED) sb.removeAllChannels(); // закрываем подписки текущей сессии перед выходом
    await sb.auth.signOut();
  });
}

(async function init(){
  if(!CONFIGURED){
    // без настроенной базы авторизация невозможна — показываем приложение с предупреждением
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
    await bootApp();
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if(session){
    showApp(session.user.email);
  }else{
    showLogin();
  }

  sb.auth.onAuthStateChange((event, session)=>{
    if(session){
      showApp(session.user.email);
    }else{
      showLogin();
    }
  });
})();
</script>
